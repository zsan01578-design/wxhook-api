[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxhook-api"
version = "0.1.0"
description = "FastAPI bridge for an existing WeChat Hook HTTP service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "Pillow>=11.3,<14",
  "parse-video-py @ https://codeload.github.com/wujunwei928/parse-video-py/zip/5fcf87256edb5ffcdebf0e4aac2a5a41745da76e#sha256=cb16d6f6f94415167907e0f5bf808ac88b38157ccab32eb196c325e5647e94a3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
wxhook-api = "wxhook_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wxhook_api = ["web/*.html", "web/*.css", "web/*.js",
  "resources/relationship_advisor/*.md", "resources/relationship_advisor/LICENSE",
  "resources/relationship_advisor/knowledge/*.md", "resources/relationship_advisor/practical/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "build", "data", "tests/browser"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701"]

[tool.coverage.run]
source = ["wxhook_api"]
