<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊管理 · wxhook</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/assets/manage.css">
  <link rel="stylesheet" href="/ui/assets/chat.css">
  <link rel="stylesheet" href="/ui/assets/tools.css">
  <script src="/ui/assets/http.js" defer></script>
  <script src="/ui/assets/manage.js" defer></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 10 10 0 0 1-3.7-.7L3 21l1.6-4.5A8 8 0 0 1 3 11.5a9 9 0 0 1 18 0Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l3 3h9v12H3V7Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 4 4v2H5v-2l4-4-1-6ZM12 15v6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M3 21l5-1L21 7l-5-5L3 15v6Z"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="m10 8 6 4-6 4V8Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
  </defs></svg>

  <div class="app-shell">
    <nav class="rail" aria-label="主导航">
      <div class="brand" title="wxhook"><svg class="icon"><use href="#i-chat"/></svg></div>
      <div class="rail-links">
        <button class="rail-button selected" id="nav-groups" aria-label="群聊管理" aria-current="page" title="群聊管理"><svg class="icon"><use href="#i-users"/></svg><span>群聊</span></button>
        <button class="rail-button" id="nav-blacklist" aria-label="黑名单" title="黑名单"><svg class="icon"><use href="#i-shield"/></svg><span>黑名单</span></button>
        <a class="rail-button" href="/messages" aria-label="微信消息" title="微信消息"><svg class="icon"><use href="#i-chat"/></svg><span>消息</span></a>
        <a class="rail-button" href="/private" aria-label="私聊问答" title="私聊问答"><svg class="icon"><use href="#i-chat"/></svg><span>私聊</span></a>
        <a class="rail-button" href="/douyin" aria-label="分享解析资源" title="分享解析资源"><svg class="icon"><use href="#i-folder"/></svg><span>资源</span></a>
        <button class="rail-button" id="ai-model-settings" aria-label="AI 模型配置" title="AI 模型配置"><svg class="icon"><use href="#i-settings"/></svg><span>AI 模型</span></button>
      </div>
      <div class="rail-bottom"><button class="rail-button" id="connection-settings" aria-label="连接设置" title="连接设置"><svg class="icon"><use href="#i-settings"/></svg></button><span class="profile" title="本地管理员">管</span></div>
    </nav>

    <aside class="conversations" aria-label="群聊列表">
      <div class="list-heading"><div><h1>群聊</h1><span id="group-total">0 个群聊</span></div><button class="icon-button" id="add-group-small" aria-label="添加群聊" title="添加群聊"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      <div class="search-field"><svg class="icon"><use href="#i-search"/></svg><input id="group-search" type="search" placeholder="搜索群名称或群 ID" aria-label="搜索群聊" autocomplete="off"></div>
      <div class="list-filters" aria-label="筛选群聊"><button data-filter="all" class="active" aria-pressed="true">全部</button><button data-filter="active" aria-pressed="false">已启用</button><button data-filter="inactive" aria-pressed="false">未启用</button><button data-filter="blocked" aria-pressed="false">已拉黑</button></div>
      <div id="group-list" class="group-list"><div class="list-empty">正在载入群聊…</div></div>
      <div class="list-footer"><span class="live-dot"></span><span>微信自动同步 · 实时记录消息</span></div>
    </aside>

    <main class="workspace">
      <header class="topbar"><div class="page-identity"><button id="back-to-list" class="icon-button" aria-label="返回群聊列表"><svg class="icon"><use href="#i-back"/></svg></button><div><div class="eyebrow">WXHOOK <span>/</span> 本地工作台</div><h2 id="page-title">群聊管理</h2></div></div><div class="topbar-actions"><button id="connection-indicator" class="connection-indicator" title="查看连接设置"><span id="connection-dot" class="live-dot muted"></span><span id="connection-label">检查连接中</span></button><button class="icon-button" id="refresh" title="刷新数据" aria-label="刷新数据"><svg class="icon"><use href="#i-refresh"/></svg></button><button class="button primary" id="add-group"><svg class="icon"><use href="#i-plus"/></svg><span>添加群聊</span></button></div></header>

      <div class="sync-bar"><div><span id="sync-phase" class="live-dot muted"></span><span id="sync-status" role="status">等待微信自动同步…</span></div><button id="sync-now" class="text-link">立即同步</button></div>
      <div id="overview" class="overview" aria-label="管理概览"></div>

      <div id="group-workspace" class="group-workspace" hidden>
        <section class="group-main">
          <header id="group-header" class="group-header"></header>
          <div id="restriction-banner" class="restriction-banner" hidden></div>
          <nav class="tabs" aria-label="群聊管理内容"><button data-tab="messages" class="active" aria-current="page">群消息</button><button data-tab="favorites">群收藏</button><button data-tab="radar">群聊雷达</button><button data-tab="tools">群工具</button><button data-tab="features">功能配置</button><button data-tab="members">群成员 <span id="member-tab-count">0</span></button><button data-tab="audit">操作记录</button></nav>
          <div id="tab-content" class="tab-content"></div>
          <footer class="detail-footer"><svg class="icon"><use href="#i-shield"/></svg><span>配置仅保存在本机 · 修改后立即生效</span><span class="footer-mark">WXHOOK</span></footer>
        </section>
        <aside id="inspector" class="inspector" aria-label="群聊资料"></aside>
      </div>
      <section id="welcome" class="welcome" hidden></section>
      <section id="blacklist-view" class="blacklist-view" hidden></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><div><p id="modal-eyebrow" class="eyebrow">群聊管理</p><h2 id="modal-title"></h2></div><button id="close-modal" class="icon-button" aria-label="关闭弹窗"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="modal-body"></div></dialog>
</body>
</html>
