# 可在 http://127.0.0.1:8000/douyin 配置；页面设置保存在 douyin.local.yml。
# 不启用或群名单为空时，不处理任何分享链接。
enabled: false
groups: []
# groups:
#   - '123456789@chatroom'
auto-download: true
# 在来源群提示开始和失败；下载成功后回传图片或 MP4 文件。
notify-group: true
send-results: true
# API 地址含账号标识，请在“资源”页面填写，保存到本机 douyin.local.yml。
# 默认直接调用 Python 库，无需单独启动解析服务。
# 兼容 api（原指定接口）和 builtin（原抖音公开分享页解析）。
parser-config-version: 2
parser-provider: parse_video
parser-api-url: ''
output-dir: downloads/douyin
max-file-mb: 100
# 每天北京时间凌晨 3 点清理；启动时也会补清理已过期的文件。
# 已回传保留 24 小时，失败或未回传保留 3 天，解析记录保留 30 天。
cleanup-enabled: true
cleanup-hour: 3
