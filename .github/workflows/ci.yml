name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validated runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock
      - name: Install project and test tools
        run: |
          python -m pip install -e . --no-deps
          python -m pip install "pytest>=8,<9" "pytest-asyncio>=0.23,<1" "asgi-lifespan>=2.1,<3" "pytest-cov>=5,<7" "ruff>=0.6,<1"
      - name: Compile and check dependencies
        run: |
          python -m compileall -q src
          python -m pip check
      - name: Lint
        run: ruff check src tests
      - name: Backend tests
        run: python -m pytest -q --cov=wxhook_api --cov-report=term-missing
